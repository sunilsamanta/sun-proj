<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Animated Landing Page</title>

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Full page background image */
    body, html {
      height: 100%;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: url("bg-2.jpg") no-repeat center center/cover;
      overflow: hidden;
    }

    /* Overlay for soft gradient effect */
    .overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 1;
    }

    /* Floating dots container */
    .dots {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      overflow: hidden;
      z-index: 2;
    }

    .dot {
      position: absolute;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: floatDots 10s infinite ease-in-out alternate;
    }

    /* Animation for dots movement */
    @keyframes floatDots {
      0% {
        transform: translate(0, 0);
      }
      50% {
        transform: translate(40px, -30px);
      }
      100% {
        transform: translate(-40px, 30px);
      }
    }

    /* Main content section */
    .content {
      position: relative;
      z-index: 3;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: white;
    }

    .content h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .content p {
      font-size: 1.25rem;
      margin-bottom: 30px;
    }

    .btn-custom {
      background-color: #00b4d8;
      border: none;
      color: white;
      font-weight: 600;
      padding: 12px 30px;
      border-radius: 30px;
      transition: all 0.3s ease;
    }

    .btn-custom:hover {
      background-color: #0077b6;
    }
  </style>
</head>

<body>
  <div class="overlay"></div>

  <!-- Animated Dots Layer -->
  <div class="dots">
    <!-- Random sized and placed dots -->
    <div class="dot" style="width:8px; height:8px; top:10%; left:15%; animation-delay: 1s;"></div>
    <div class="dot" style="width:10px; height:10px; top:30%; left:50%; animation-delay: 3s;"></div>
    <div class="dot" style="width:6px; height:6px; top:60%; left:70%; animation-delay: 5s;"></div>
    <div class="dot" style="width:12px; height:12px; top:80%; left:25%; animation-delay: 2s;"></div>
    <div class="dot" style="width:7px; height:7px; top:40%; left:85%; animation-delay: 4s;"></div>
    <div class="dot" style="width:9px; height:9px; top:75%; left:45%; animation-delay: 6s;"></div>
  </div>

  <!-- Content Section -->
  <div class="content container">
    <div>
      <h1>Welcome to My Landing Page</h1>
      <p>Creative UI/UX Designer crafting smooth, modern digital experiences.</p>
      <a href="#" class="btn btn-custom">Explore Now</a>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
